app = 'stereobot-development'
primary_region = 'iad'

[env]
  ENV = "dev"

[build]

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_start_machines = true
  auto_stop_machines = false  # prevent automatic suspension
  min_machines_running = 1  # keep a machine running at all times

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
